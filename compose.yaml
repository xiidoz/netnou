# Runs Netnou on any Docker host from the published image:
#
#   docker compose up -d
#
# Then open http://localhost:8080. The first start downloads and imports about
# 800 MB of timetable and OpenStreetMap data, which takes a few minutes.
#
# This file needs nothing else from the repository: it can be downloaded on its
# own or pasted into Portainer or a similar tool as it is. To build the image
# from a checkout instead, see compose.build.yaml.
#
# To update: "docker compose pull", then "docker compose up -d".
# Settings of your own host (container name, proxy network, ...) belong in a
# compose.override.yaml next to this file: Compose merges it in by itself and
# git ignores it.
name: "netnou"

services:
  netnou:
    # "latest" is the newest release. A version such as "0.3" stays on that
    # line of releases; "edge" follows the main branch, commit by commit.
    image: "ghcr.io/xiidoz/netnou:latest"
    restart: "unless-stopped"
    ports:
      # host:container. PORT is the port this host publishes, NETNOU_PORT the
      # one the server listens on inside the container. Both are 8080 unless
      # set where Compose reads its variables: in a file ".env" next to this
      # one, in the shell, or among the values of a stack. Put "127.0.0.1:" in
      # front behind a reverse proxy on the same host, or remove the block
      # when the proxy reaches the container over a Docker network.
      - "${PORT:-8080}:${NETNOU_PORT:-8080}"
    environment:
      # (the right side above: the server has to listen where the port leads)
      NETNOU_PORT: "${NETNOU_PORT:-8080}"
      # Optional settings, all described in docs/configuration.md. To use one,
      # uncomment its line.
      # Another area than the default (the VGN around Nürnberg): a rectangle
      # "south,west,north,east", its name, and the OpenStreetMap extracts that
      # cover it. Without extracts the vehicles move in straight lines.
      # NETNOU_BBOX: "49.30,10.82,49.68,11.30"
      # NETNOU_AREA_NAME: "Nürnberg, Fürth, Erlangen"
      # NETNOU_OSM_PBF_URLS: "https://download.geofabrik.de/europe/germany/bayern/mittelfranken-latest.osm.pbf"
      # One operator and no others, by its name in the feed. With
      # NETNOU_AREA: "all" in place of an area, wherever its lines run.
      # NETNOU_AGENCIES: "VerkehrsAG Nürnberg"
      # Seconds between two fetches of the realtime feed (10 to 15 MB each)
      # while somebody is looking at the map: 60 unless set. With 30 a delay
      # shows half a minute sooner, for twice the traffic.
      # NETNOU_REALTIME_INTERVAL_SECONDS: "30"
      # Another map behind the vehicles: the address of any style for MapLibre.
      # The default is the "bright" style of OpenFreeMap.
      # NETNOU_MAP_STYLE_URL: "https://tiles.openfreemap.org/styles/positron"
      # A name of its own for this instance, where the page names itself.
      # The credits keep naming Netnou.
      # NETNOU_SITE_NAME: "Bus & Bahn live"
      # A title and a description of its own, as a search result and a
      # preview of a link show them, for the people this instance is for.
      # Without them the page words its own. One text is for every language;
      # texts by language are a JSON object, '{"de": "…", "en": "…"}', or a
      # setting for each, NETNOU_SITE_TITLE_EN.
      # NETNOU_SITE_TITLE: "Bus & Bahn live im Großraum Nürnberg"
      # NETNOU_SITE_DESCRIPTION: "Wo ist meine Bahn? Busse, Straßenbahnen, U- und S-Bahnen live auf der Karte, mit Verspätungen und Abfahrten."
      # (Icons of your own need no setting: see "volumes" below.)
      # Links of your own at the foot of the header card, such as an imprint
      # and a privacy notice: a text and an address each. The pages are yours.
      # NETNOU_LINKS: "Impressum=/impressum, Datenschutz=/datenschutz"
      # The address visitors reach this instance under. With it the page can
      # name its own address to search engines and carry a picture for
      # previews of links, and there is a /sitemap.xml.
      # NETNOU_PUBLIC_URL: "https://transit.example.org/"
      # For an instance with an address that search engines are not to list,
      # such as a test instance next to the real one. Without an address an
      # instance is not listed anyway.
      # NETNOU_SEARCH_ENGINES: "off"
      # No daily question to GitHub whether there is a newer release, and no
      # marker in the page when there is one.
      # NETNOU_UPDATE_CHECK: "off"
      # Importing a timetable takes about 1.1 GB of memory for a minute
      # (measured for the default area). Node derives its heap limit from the
      # memory it sees; on a small host, or with a memory limit on the
      # container, set it explicitly. Do not limit the container to less than
      # about 2 GB: each time it is killed for running out of memory it
      # restarts and downloads the 300 MB timetable again.
      # NODE_OPTIONS: "--max-old-space-size=2048"
    read_only: true
    cap_drop:
      - "ALL"
    security_opt:
      - "no-new-privileges:true"
    volumes:
      # Timetable and OpenStreetMap caches, up to about 1 GB while importing;
      # they are rebuilt from the feeds if lost, nothing else is written. A new
      # named volume takes over the ownership of /data in the image, which
      # makes it writable for the unprivileged "node" user. A bind mount
      # instead has to be writable for uid 1000.
      - type: "volume"
        source: "data"
        target: "/data"
      # Icons and a preview picture of your own, in a folder next to this file
      # (docs/configuration.md, "Icons of your own"). Read only: the server
      # just looks at them.
      # - type: "bind"
      #   source: "./brand"
      #   target: "/brand"
      #   read_only: true

volumes:
  data:
