name: CI

on:
  push:
    # Other branches are tested through their pull request, not twice.
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Developed on Windows, deployed on Linux; every supported Node.js line.
        os: [ubuntu-latest, windows-latest]
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run lint

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate the compose files
        run: |
          docker compose config --quiet
          docker compose -f compose.yaml -f compose.build.yaml config --quiet
      # Built exactly as release.yml builds it, but not pushed.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false

  # The one check that the rule protecting main asks for, so that it need not
  # name the jobs above, which change with the versions of Node.js. It runs
  # also when one of them failed or was cancelled, and then fails itself: a
  # check that was skipped would count as passed.
  passed:
    name: CI passed
    needs: [test, lint, docker]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Every job above succeeded
        run: |
          echo "$RESULTS"
          ! echo "$RESULTS" | grep -q -E 'failure|cancelled|skipped'
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
