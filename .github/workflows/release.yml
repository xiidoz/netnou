name: Release

# On every push to main:
#
# 1. release-please keeps a "release pull request" up to date. It works out the
#    next version from the commit messages since the last release (see
#    CONTRIBUTING.md), sets it in package.json and writes CHANGELOG.md. Merging
#    that pull request is the release: release-please then tags the commit
#    vX.Y.Z and publishes a GitHub release. Whatever the push was, the pull
#    request ends up on top of it (see the second step of the first job).
# 2. The container image is built and pushed to ghcr.io/xiidoz/netnou: always
#    as "edge", and for a release also as "latest", X.Y.Z, X.Y and - from
#    1.0.0 on - X. So "latest" is the newest release and "edge" is main.
# 3. If the repository names an address for it, an instance of the operator's
#    is told to fetch the new image, and the run waits until it answers as
#    this commit (see "Deploying what was built" in CONTRIBUTING.md).
#
# It can also be started by hand, for main: should GitHub start no workflow for
# a push, which has happened, the release pull request would otherwise stay as
# it was, one merge behind, until the next push.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One at a time: two runs must not both decide on a release.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Release pull request
    # Forks inherit this file but do not make releases of their own. Started
    # by hand for another branch, there is nothing to release either.
    if: github.repository == 'xiidoz/netnou' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # GitHub starts no workflows for what a workflow does with its own
          # token, so with the default one CI does not run on the release pull
          # request. A personal access token or app token in this secret
          # changes that; without the secret everything else works the same.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

      # release-please writes its pull request anew only when a push adds
      # something to the notes. After any other push (docs, tests, CI) it
      # leaves it as it is, behind main, and main takes no pull request that
      # does not contain its latest commit. So it is put on top of main here,
      # as release-please itself leaves it: the same change, moved. Version
      # and changelog stay what release-please made them.
      - name: Keep the release pull request on top of main
        run: |
          # the one release-please made: by its label and the name of its branch here, not in a fork
          own='map(select((.isCrossRepository | not) and (.headRefName | startswith("release-please--"))))[0].number // empty'
          number=$(gh pr list --state open --base "$GITHUB_REF_NAME" --label 'autorelease: pending' --json number,headRefName,isCrossRepository --jq "$own")
          if [ -z "$number" ]; then
            echo "No release pull request is open."
            exit 0
          fi
          head=$(gh pr view "$number" --json headRefName --jq .headRefName)
          behind=$(gh api "repos/$GH_REPO/compare/$head...$GITHUB_REF_NAME" --jq .ahead_by)
          if [ "$behind" = 0 ]; then
            echo "Pull request #$number contains the latest commit of $GITHUB_REF_NAME."
            exit 0
          fi
          echo "Pull request #$number is behind $GITHUB_REF_NAME by $behind."
          # Not worth a failed release run: until it is brought up to date by
          # hand, the pull request just cannot be merged.
          if ! gh pr update-branch "$number" --rebase; then
            echo "::warning title=Release pull request left behind::Pull request #$number could not be put on top of $GITHUB_REF_NAME. Use \"Update branch\" on it before merging it."
          fi
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

  image:
    name: Container image
    needs: release-please
    # Also when release-please failed: "edge" does not depend on it.
    if: ${{ !cancelled() && github.repository == 'xiidoz/netnou' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      release: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Never publish what does not pass its tests. They need no "npm ci":
      # the server has no dependencies.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - run: npm test

      # A release is a tag vX.Y.Z on this commit, set by the job above when the
      # release pull request was merged. The tag is looked up instead of taken
      # from that job's output, so that running this workflow again for the
      # same commit publishes the same image tags.
      - id: release
        name: Is this commit a release?
        run: |
          ref=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v" --jq "map(select(.object.sha == \"$GITHUB_SHA\"))[0].ref // \"\"")
          echo "tag=${ref#refs/tags/}" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/xiidoz/netnou
          # "latest" is what the second line below says and nothing else:
          # people who follow it get releases, not every commit. There is no
          # tag "0": below 1.0.0 a new minor version may break things, so a
          # tag that follows all of 0.x would promise too much.
          flavor: latest=false
          tags: |
            type=raw,value=edge
            type=raw,value=latest,enable=${{ steps.release.outputs.tag != '' }}
            type=semver,pattern={{version}},value=${{ steps.release.outputs.tag }},enable=${{ steps.release.outputs.tag != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.release.outputs.tag }},enable=${{ steps.release.outputs.tag != '' }}
            type=semver,pattern={{major}},value=${{ steps.release.outputs.tag }},enable=${{ steps.release.outputs.tag != '' && !startsWith(steps.release.outputs.tag, 'v0.') }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # What the server reports as its version: the number of the release,
          # or "edge" with this commit (see the Dockerfile).
          build-args: |
            COMMIT=${{ github.sha }}
            RELEASE=${{ steps.release.outputs.tag != '' }}

  # Nothing here says where anything runs: the addresses are settings of the
  # repository. Without them, as in a fork, the job has nothing to do.
  #   secret DEPLOY_HOOK              an address that is called once the image
  #                                   is pushed, with POST; whatever answers
  #                                   there fetches the image and starts the
  #                                   instances that use it anew
  #   secret DEPLOY_HOOK_TOKEN        sent with the call as a bearer token, if set
  #   variable DEPLOY_STATUS_EDGE     the /api/status of an instance that
  #                                   follows "edge": it has to report this
  #                                   commit within ten minutes
  #   variable DEPLOY_STATUS_RELEASE  the same of one that follows "latest",
  #                                   looked at after a release only
  deploy:
    name: Deploy
    needs: image
    if: ${{ !cancelled() && needs.image.result == 'success' }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Tell the instances and wait for them
        run: |
          if [ -z "$HOOK" ]; then
            echo "No deploy hook is set: nothing to do."
            exit 0
          fi
          auth=()
          if [ -n "$HOOK_TOKEN" ]; then auth=(-H "Authorization: Bearer $HOOK_TOKEN"); fi
          # (it may answer only when it is done with fetching and starting)
          curl --fail --silent --show-error --max-time 600 -X POST "${auth[@]}" -o /dev/null "$HOOK"
          echo "The deploy hook has answered."

          checks=()
          if [ -n "$STATUS_EDGE" ]; then checks+=("edge|$STATUS_EDGE"); fi
          if [ -n "$RELEASE" ] && [ -n "$STATUS_RELEASE" ]; then checks+=("release|$STATUS_RELEASE"); fi
          failed=0
          for check in "${checks[@]}"; do
            name=${check%%|*}
            url=${check#*|}
            echo "Waiting for the $name instance to run $GITHUB_SHA."
            commit=
            for _ in $(seq 60); do
              commit=$(curl --silent --max-time 10 "$url" | jq --raw-output '.commit // empty' 2>/dev/null || true)
              if [ "$commit" = "$GITHUB_SHA" ]; then break; fi
              sleep 10
            done
            if [ "$commit" = "$GITHUB_SHA" ]; then
              echo "It does."
            else
              echo "::error title=Not deployed::The $name instance does not run $GITHUB_SHA after ten minutes. It reports \"${commit:-nothing}\"."
              failed=1
            fi
          done
          exit "$failed"
        env:
          HOOK: ${{ secrets.DEPLOY_HOOK }}
          HOOK_TOKEN: ${{ secrets.DEPLOY_HOOK_TOKEN }}
          STATUS_EDGE: ${{ vars.DEPLOY_STATUS_EDGE }}
          STATUS_RELEASE: ${{ vars.DEPLOY_STATUS_RELEASE }}
          RELEASE: ${{ needs.image.outputs.release }}
