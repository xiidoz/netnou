name: Release

# On every push to main:
#
# 1. release-please keeps a "release pull request" up to date. It works out the
#    next version from the commit messages since the last release (see
#    CONTRIBUTING.md), sets it in package.json and writes CHANGELOG.md. Merging
#    that pull request is the release: release-please then tags the commit
#    vX.Y.Z and publishes a GitHub release. Whatever the push was, the pull
#    request ends up on top of it (see the step "Keep the release pull
#    request on top of main"). Claude proposes a name for the release and a
#    few sentences on what it brings, in the pull request, whose description
#    shows the release as it will be published, and the release is published
#    with them (see "Releases" in CONTRIBUTING.md).
# 2. The container image is built and pushed to ghcr.io/xiidoz/netnou: always
#    as "edge", and for a release also as "latest", X.Y.Z, X.Y and - from
#    1.0.0 on - X. So "latest" is the newest release and "edge" is main.
# 3. If the repository names addresses for it, the operator's instances that
#    follow "edge", and after a release those that follow "latest", are told
#    to fetch the new image, and the run waits until they answer as this
#    commit (see "Deploying what was built" in CONTRIBUTING.md).
#
# It can also be started by hand, for main: should GitHub start no workflow for
# a push, which has happened, the release pull request would otherwise stay as
# it was, one merge behind, until the next push.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One at a time: two runs must not both decide on a release.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Release pull request
    # Forks inherit this file but do not make releases of their own. Started
    # by hand for another branch, there is nothing to release either.
    if: github.repository == 'xiidoz/netnou' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      # For tools/release-notes.mjs, which reads and writes the name of a
      # release in CHANGELOG.md.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      # Should release-please write the release pull request anew below, the
      # name the release had goes with it. It is kept here for Claude, who is
      # asked to keep it if it still fits (see "Name the release pull request").
      - name: Note the name the release pull request has
        # Only a hint for later: never in the way of a release.
        continue-on-error: true
        run: |
          # The release pull request is picked out of the open ones by its
          # label and its branch, here and in the steps below. gh is not
          # asked for it with --label: gh then asks GitHub's search, which
          # finds a pull request only some seconds after it was opened, and
          # release-please may have opened it just before the steps below.
          own='map(select((.isCrossRepository | not) and (.headRefName | startswith("release-please--")) and any(.labels[]; .name == "autorelease: pending")))[0] // empty | [.headRefName, .title] | @tsv'
          pr=$(gh pr list --state open --base "$GITHUB_REF_NAME" --limit 100 --json headRefName,title,isCrossRepository,labels --jq "$own")
          if [ -z "$pr" ]; then
            echo "No release pull request is open."
            exit 0
          fi
          IFS=$'\t' read -r head title <<< "$pr"
          gh api -H 'Accept: application/vnd.github.raw+json' "repos/$GH_REPO/contents/CHANGELOG.md?ref=$head" > "$RUNNER_TEMP/before.md"
          node tools/release-notes.mjs read "$RUNNER_TEMP/before.md" "${title##* }" | jq '{name, text}' > "$RUNNER_TEMP/previous.json" || true
          name=$(jq -r '.name // ""' "$RUNNER_TEMP/previous.json" 2>/dev/null || true)
          echo "The release it proposes is called \"${name:-(no name)}\"."
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

      # release-please writes its pull request anew whenever the description
      # is not exactly the one it would write. The description shown in its
      # place (see "Name the release pull request") keeps release-please's own
      # at its end, and it is put back here, so that release-please writes
      # the pull request anew only where it would have done so anyway.
      - name: Give release-please its own description back
        # Else release-please writes the pull request anew, and the release
        # is named again: not worth a failed run.
        continue-on-error: true
        run: |
          own='map(select((.isCrossRepository | not) and (.headRefName | startswith("release-please--")) and any(.labels[]; .name == "autorelease: pending")))[0].number // empty'
          number=$(gh pr list --state open --base "$GITHUB_REF_NAME" --limit 100 --json number,headRefName,isCrossRepository,labels --jq "$own")
          if [ -z "$number" ]; then
            echo "No release pull request is open."
            exit 0
          fi
          # (exactly, as release-please compares it)
          gh api "repos/$GH_REPO/pulls/$number" | jq -j '.body // ""' > "$RUNNER_TEMP/shown.md"
          node tools/release-notes.mjs original < "$RUNNER_TEMP/shown.md" > "$RUNNER_TEMP/original.md"
          if cmp -s "$RUNNER_TEMP/shown.md" "$RUNNER_TEMP/original.md"; then
            echo "Pull request #$number has the description release-please wrote."
            exit 0
          fi
          jq -n --rawfile body "$RUNNER_TEMP/original.md" '{body: $body}' \
            | gh api -X PATCH "repos/$GH_REPO/pulls/$number" --input - > /dev/null
          echo "Pull request #$number has the description release-please wrote again."
        env:
          # (with the workflow's own token, which starts no workflows: an
          # edited description is not worth checking the commits again)
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

      - uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # GitHub starts no workflows for what a workflow does with its own
          # token, so with the default one CI does not run on the release pull
          # request. A personal access token or app token in this secret
          # changes that; without the secret everything else works the same.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

      # release-please publishes a release as "vX.Y.Z", with its notes from the
      # description of the release pull request. The release takes its name
      # from the merged CHANGELOG.md, in its title, and the section of the
      # changelog as its notes, without the day in the heading in any case
      # (GitHub shows when it was published). The tag is looked up, as in the
      # job "image", so that running this workflow again for the same commit
      # names the release again.
      - name: Give the release its name
        # A release left as "vX.Y.Z" is not worth a failed run; the step shows
        # that it failed all the same.
        continue-on-error: true
        run: |
          ref=$(gh api "repos/$GH_REPO/git/matching-refs/tags/v" --jq "map(select(.object.sha == \"$GITHUB_SHA\"))[0].ref // \"\"")
          tag=${ref#refs/tags/}
          if [ -z "$tag" ]; then
            echo "This commit is not a release."
            exit 0
          fi
          release=$(node tools/release-notes.mjs read CHANGELOG.md "${tag#v}")
          name=$(jq -r .name <<< "$release")
          jq -r .section <<< "$release" > "$RUNNER_TEMP/notes.md"
          gh release edit "$tag" --title "$tag${name:+ – $name}" --notes-file "$RUNNER_TEMP/notes.md" > /dev/null
          echo "Release $tag is called \"$tag${name:+ – $name}\"."
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

      # release-please writes its pull request anew only when a push adds
      # something to the notes. After any other push (docs, tests, CI) it
      # leaves it as it is, behind main, and main takes no pull request that
      # does not contain its latest commit. So it is put on top of main here,
      # as release-please itself leaves it: the same change, moved. Version
      # and changelog stay what release-please made them.
      - name: Keep the release pull request on top of main
        run: |
          # the one release-please made: by its label and the name of its branch here, not in a fork
          own='map(select((.isCrossRepository | not) and (.headRefName | startswith("release-please--")) and any(.labels[]; .name == "autorelease: pending")))[0].number // empty'
          number=$(gh pr list --state open --base "$GITHUB_REF_NAME" --limit 100 --json number,headRefName,isCrossRepository,labels --jq "$own")
          if [ -z "$number" ]; then
            echo "No release pull request is open."
            exit 0
          fi
          head=$(gh pr view "$number" --json headRefName --jq .headRefName)
          behind=$(gh api "repos/$GH_REPO/compare/$head...$GITHUB_REF_NAME" --jq .ahead_by)
          if [ "$behind" = 0 ]; then
            echo "Pull request #$number contains the latest commit of $GITHUB_REF_NAME."
            exit 0
          fi
          echo "Pull request #$number is behind $GITHUB_REF_NAME by $behind."
          # Not worth a failed release run: until it is brought up to date by
          # hand, the pull request just cannot be merged.
          if ! gh pr update-branch "$number" --rebase; then
            echo "::warning title=Release pull request left behind::Pull request #$number could not be put on top of $GITHUB_REF_NAME. Use \"Update branch\" on it before merging it."
          fi
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

      # The section of the release in the pull request's CHANGELOG.md loses the
      # day release-please writes in its heading. Where it has no name, Claude
      # is asked for one and for a few sentences, from the list, the
      # description of each listed pull request up to its pictures, and the
      # names of the releases before it, which its name must not repeat
      # (tools/release-notes.mjs); a section whose name repeats one is asked
      # for anew. What changed is committed to the pull
      # request. release-please compares only the description of its pull
      # request, so it keeps the commit until a merge adds to the notes; then
      # it writes the pull request anew, and Claude is asked again, with the
      # name the release had. A name written by hand is left alone in the same
      # way. Without the secret ANTHROPIC_API_KEY nothing is asked.
      #
      # Then the description of the pull request is written to show the
      # release as it will be published: its title, and its section as its
      # notes, with release-please's own description kept at its end (see
      # "Give release-please its own description back").
      - name: Name the release pull request
        # A release without a name is not worth a failed run.
        continue-on-error: true
        run: |
          own='map(select((.isCrossRepository | not) and (.headRefName | startswith("release-please--")) and any(.labels[]; .name == "autorelease: pending")))[0] // empty | [.number, .headRefName, .title] | @tsv'
          pr=$(gh pr list --state open --base "$GITHUB_REF_NAME" --limit 100 --json number,headRefName,title,isCrossRepository,labels --jq "$own")
          if [ -z "$pr" ]; then
            echo "No release pull request is open."
            exit 0
          fi
          IFS=$'\t' read -r number head title <<< "$pr"
          version=${title##* }
          changelog=$RUNNER_TEMP/CHANGELOG.md
          gh api -H 'Accept: application/vnd.github.raw+json' "repos/$GH_REPO/contents/CHANGELOG.md?ref=$head" > "$changelog"
          cp "$changelog" "$RUNNER_TEMP/CHANGELOG.before.md"
          release=$(node tools/release-notes.mjs read "$changelog" "$version")
          jq '{name, text}' <<< "$release" > "$RUNNER_TEMP/answer.json"
          message="chore(main): no date in the heading of release $version"

          # Asks Claude for a name and sentences, into answer.json; says why not
          # where there are none.
          ask() {
            local pulls='[]' pull body about previous
            for pull in $(jq -r '.pulls[]' <<< "$release"); do
              body=$(gh pr view "$pull" --json body --jq .body 2>/dev/null || true)
              about=$(node tools/release-notes.mjs excerpt <<< "$body")
              pulls=$(jq --argjson number "$pull" --arg about "$about" '. + [{number: $number, about: $about}]' <<< "$pulls")
            done
            previous=$(jq -c -s '.[0] // null' "$RUNNER_TEMP/previous.json" 2>/dev/null || echo null)
            jq -n --arg version "$version" --argjson release "$release" --argjson pulls "$pulls" --argjson previous "$previous" \
              '{version: $version, section: $release.section, pulls: $pulls, previous: $previous, earlier: $release.earlier}' \
              | node tools/release-notes.mjs request > "$RUNNER_TEMP/request.json" || return 1
            # (fallbacks: should the model decline, another one answers in the same call)
            if ! curl --silent --show-error --max-time 600 https://api.anthropic.com/v1/messages \
                -H 'Content-Type: application/json' \
                -H "x-api-key: $ANTHROPIC_API_KEY" \
                -H 'anthropic-version: 2026-10-21' \
                -H 'anthropic-beta: server-side-fallback-2026-07-01' \
                --data @"$RUNNER_TEMP/request.json" > "$RUNNER_TEMP/response.json"; then
              echo "::warning title=Release not named::The Claude API could not be reached."
              return 1
            fi
            if ! node tools/release-notes.mjs answer "$changelog" "$version" < "$RUNNER_TEMP/response.json" > "$RUNNER_TEMP/claude.json" 2> "$RUNNER_TEMP/why.txt"; then
              echo "::warning title=Release not named::No name from Claude: $(cat "$RUNNER_TEMP/why.txt")"
              return 1
            fi
            mv "$RUNNER_TEMP/claude.json" "$RUNNER_TEMP/answer.json"
          }
          repeats=$(jq -r '.repeats // ""' <<< "$release")
          if [ -n "$repeats" ]; then
            echo "Pull request #$number calls the release \"$(jq -r .name <<< "$release")\", which repeats the name of an earlier release, \"$repeats\"."
          fi
          if [ -n "$(jq -r .name <<< "$release")" ] && [ -z "$repeats" ]; then
            echo "Pull request #$number calls the release \"$(jq -r .name <<< "$release")\"."
          elif [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "No secret ANTHROPIC_API_KEY: the release is not given a name."
          elif ask; then
            message="chore(main): name release $version"
            echo "Pull request #$number calls the release \"$(jq -r .name "$RUNNER_TEMP/answer.json")\":"
            jq -r .text "$RUNNER_TEMP/answer.json"
          fi

          node tools/release-notes.mjs write "$changelog" "$version" < "$RUNNER_TEMP/answer.json"
          if ! cmp -s "$changelog" "$RUNNER_TEMP/CHANGELOG.before.md"; then
            blob=$(gh api "repos/$GH_REPO/contents/CHANGELOG.md?ref=$head" --jq .sha)
            jq -n --arg branch "$head" --arg sha "$blob" --arg message "$message" \
              --rawfile content <(base64 -w0 "$changelog") '{branch: $branch, sha: $sha, message: $message, content: $content}' \
              | gh api -X PUT "repos/$GH_REPO/contents/CHANGELOG.md" --input - > /dev/null
            echo "Committed to pull request #$number: $message"
          fi

          # (exactly, so that an unchanged description is left alone)
          gh api "repos/$GH_REPO/pulls/$number" | jq -j '.body // ""' > "$RUNNER_TEMP/shown.md"
          node tools/release-notes.mjs describe "$changelog" "$version" < "$RUNNER_TEMP/shown.md" > "$RUNNER_TEMP/described.md"
          if cmp -s "$RUNNER_TEMP/shown.md" "$RUNNER_TEMP/described.md"; then
            echo "The description of pull request #$number shows the release as it will be published."
            exit 0
          fi
          # (with the workflow's own token, as in "Give release-please its own
          # description back")
          jq -n --rawfile body "$RUNNER_TEMP/described.md" '{body: $body}' \
            | GH_TOKEN=$EDIT_TOKEN gh api -X PATCH "repos/$GH_REPO/pulls/$number" --input - > /dev/null
          echo "The description of pull request #$number now shows the release as it will be published."
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          EDIT_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

  image:
    name: Container image
    needs: release-please
    # Also when release-please failed: "edge" does not depend on it.
    if: ${{ !cancelled() && github.repository == 'xiidoz/netnou' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      release: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Never publish what does not pass its tests. They need no "npm ci":
      # the server has no dependencies.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - run: npm test

      # A release is a tag vX.Y.Z on this commit, set by the job above when the
      # release pull request was merged. The tag is looked up instead of taken
      # from that job's output, so that running this workflow again for the
      # same commit publishes the same image tags.
      - id: release
        name: Is this commit a release?
        run: |
          ref=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v" --jq "map(select(.object.sha == \"$GITHUB_SHA\"))[0].ref // \"\"")
          echo "tag=${ref#refs/tags/}" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/xiidoz/netnou
          # "latest" is what the second line below says and nothing else:
          # people who follow it get releases, not every commit. There is no
          # tag "0": below 1.0.0 a new minor version may break things, so a
          # tag that follows all of 0.x would promise too much.
          flavor: latest=false
          tags: |
            type=raw,value=edge
            type=raw,value=latest,enable=${{ steps.release.outputs.tag != '' }}
            type=semver,pattern={{version}},value=${{ steps.release.outputs.tag }},enable=${{ steps.release.outputs.tag != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.release.outputs.tag }},enable=${{ steps.release.outputs.tag != '' }}
            type=semver,pattern={{major}},value=${{ steps.release.outputs.tag }},enable=${{ steps.release.outputs.tag != '' && !startsWith(steps.release.outputs.tag, 'v0.') }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # What the server reports as its version: the number of the release,
          # or "edge" with this commit (see the Dockerfile).
          build-args: |
            COMMIT=${{ github.sha }}
            RELEASE=${{ steps.release.outputs.tag != '' }}

  # Nothing here says where anything runs: the addresses are settings of the
  # repository. Without them, as in a fork, the job has nothing to do.
  #   secret DEPLOY_HOOK_EDGE         an address that is called with POST once
  #                                   the image is pushed; whatever answers
  #                                   there fetches "edge" and starts the
  #                                   instances that follow it anew
  #   secret DEPLOY_HOOK_RELEASE      the same for the instances that follow
  #                                   "latest", called after a release only
  #   secret DEPLOY_HOOK_SECRET       if set, signs each call as GitHub signs
  #                                   its webhooks (X-Hub-Signature-256)
  #   variable DEPLOY_STATUS_EDGE     the /api/status of an instance that
  #                                   follows "edge": it has to report this
  #                                   commit within ten minutes
  #   variable DEPLOY_STATUS_RELEASE  the same of one that follows "latest",
  #                                   looked at after a release only
  deploy:
    name: Deploy
    needs: image
    if: ${{ !cancelled() && needs.image.result == 'success' }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Tell the instances and wait for them
        run: |
          # Calls the hook of the instances that follow one tag. The body says
          # what was built; the signature is the HMAC-SHA256 of the body.
          call() {
            local tag=$1 hook=$2 body status rc=0
            local headers=(-H "Content-Type: application/json")
            body=$(jq --null-input --compact-output --arg tag "$tag" --arg commit "$GITHUB_SHA" \
              '{image: "ghcr.io/xiidoz/netnou", tag: $tag, commit: $commit}')
            if [ -n "$HOOK_SECRET" ]; then
              headers+=(-H "X-Hub-Signature-256: sha256=$(printf '%s' "$body" | openssl dgst -sha256 -hmac "$HOOK_SECRET" -r | cut -d ' ' -f 1)")
            fi
            # (it may answer only when it is done with fetching and starting)
            # The log is public: neither the answer nor curl's own message goes
            # into it, as that message names the host of the secret address.
            status=$(curl --fail --silent --max-time 600 -X POST "${headers[@]}" --data "$body" \
              --output /dev/null --write-out '%{http_code}' "$hook") || rc=$?
            case "$rc" in
              0) echo "The deploy hook of \"$tag\" has answered." ;;
              22) echo "::error title=Not deployed::The deploy hook of \"$tag\" answered with HTTP $status."
                return 1 ;;
              *) echo "::error title=Not deployed::The deploy hook of \"$tag\" could not be called (curl exit code $rc)."
                return 1 ;;
            esac
          }

          # tag|hook|status; "latest" only after a release
          targets=("edge|$HOOK_EDGE|$STATUS_EDGE")
          if [ -n "$RELEASE" ]; then targets+=("latest|$HOOK_RELEASE|$STATUS_RELEASE"); fi
          called=0
          failed=0
          checks=()
          for target in "${targets[@]}"; do
            IFS='|' read -r tag hook status <<< "$target"
            if [ -z "$hook" ]; then continue; fi
            called=1
            if call "$tag" "$hook"; then
              if [ -n "$status" ]; then checks+=("$tag|$status"); fi
            else
              failed=1
            fi
          done
          if [ "$called" = 0 ]; then
            echo "No deploy hook is set: nothing to do."
            exit 0
          fi

          for check in "${checks[@]}"; do
            tag=${check%%|*}
            url=${check#*|}
            echo "Waiting for the instance that follows \"$tag\" to run $GITHUB_SHA."
            commit=
            for _ in $(seq 60); do
              commit=$(curl --silent --max-time 10 "$url" | jq --raw-output '.commit // empty' 2>/dev/null || true)
              if [ "$commit" = "$GITHUB_SHA" ]; then break; fi
              sleep 10
            done
            if [ "$commit" = "$GITHUB_SHA" ]; then
              echo "It does."
            else
              echo "::error title=Not deployed::The instance that follows \"$tag\" does not run $GITHUB_SHA after ten minutes. It reports \"${commit:-nothing}\"."
              failed=1
            fi
          done
          exit "$failed"
        env:
          HOOK_EDGE: ${{ secrets.DEPLOY_HOOK_EDGE }}
          HOOK_RELEASE: ${{ secrets.DEPLOY_HOOK_RELEASE }}
          HOOK_SECRET: ${{ secrets.DEPLOY_HOOK_SECRET }}
          STATUS_EDGE: ${{ vars.DEPLOY_STATUS_EDGE }}
          STATUS_RELEASE: ${{ vars.DEPLOY_STATUS_RELEASE }}
          RELEASE: ${{ needs.image.outputs.release }}
