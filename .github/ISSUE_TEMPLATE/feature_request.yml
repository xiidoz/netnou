name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Two rules shape what fits into Netnou: the server has no runtime dependencies, and the page has no build step.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: The situation in which Netnou falls short today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What do you propose?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have considered
